<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CloudWatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="topnav">
    <div class="container navwrap">
      <a href="index.html">CloudWatch</a>
      <div class="navlinks">
        <a href="cadastro.html">Cadastro</a>
      </div>
    </div>
  </nav>

  <main class="auth-page">
    <section class="panel">
      <h1>Login</h1>
      <form id="loginForm">
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
        </div>
        <div class="form-row">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" required>
        </div>
        <div class="actions">
          <button type="submit">Entrar</button>
          <a href="cadastro.html">Criar conta</a>
        </div>
        <p id="msg" class="msg"></p>
      </form>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    var form = document.getElementById("loginForm");
    var msg = document.getElementById("msg");
    var existingToken = getToken();

    if (existingToken) {
      window.location.href = "acesso.html";
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      msg.className = "msg";
      msg.textContent = "Validando login...";

      var email = form.email.value.trim();
      var senha = form.senha.value;

      try {
        var data = await apiRequest(window.APP_CONFIG.endpoints.login, "POST", { email: email, senha: senha });
        saveSession(data);
        msg.className = "msg success";
        msg.textContent = "Login realizado com sucesso.";
        window.location.href = "acesso.html";
      } catch (error) {
        msg.className = "msg error";
        msg.textContent = error.message;
      }
    });
  </script>
</body>
</html>
